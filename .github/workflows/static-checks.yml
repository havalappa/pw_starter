name: Static Checks

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  static-checks:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'static_check' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Get PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefOid -q .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Set pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }} \
            -f state=pending -f context="static-checks" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit

      - name: Enforce Architecture Guidelines (Grep Checks)
        run: |
          echo "Checking for banned page.waitForTimeout()..."
          if grep -rn "waitForTimeout" tests/ pages/; then
            echo "::error::Found banned page.waitForTimeout() calls!"
            exit 1
          fi

          echo "Checking for assertions in Page Objects..."
          if grep -rn "expect(" pages/; then
            echo "::error::Found expect() assertions inside Page Objects!"
            exit 1
          fi

          echo "Checking for raw Playwright imports in test files..."
          if grep -rn "from '@playwright/test'" tests/ --exclude="auth.setup.ts"; then
            echo "::error::Found raw @playwright/test imports in test files!"
            exit 1
          fi

          echo "Checking for missing @regression tags..."
          if grep -rn "test(" tests/ --exclude="auth.setup.ts" | grep -v "@regression"; then
            echo "::error::Found test cases missing the @regression tag!"
            exit 1
          fi

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }} \
            -f state=${{ job.status == 'success' && 'success' || 'failure' }} -f context="static-checks" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
